<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRX // Contas de Players</title>
<link rel="stylesheet" href="style.css">
<style>
.account-wrap{width:min(94vw,900px);margin:40px auto}
.account-box{border:1px solid #39ff88;background:#07110b;padding:24px;box-shadow:0 0 20px #0f4}
.account-box h1{color:#39ff88}
.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.account-grid label{display:flex;flex-direction:column;gap:6px;color:#8affb5}
.account-grid input,.account-grid select{background:#020603;color:#d7ffe5;border:1px solid #247044;padding:12px;border-radius:4px}
.account-box button{margin-top:18px;background:#0b2414;color:#39ff88;border:1px solid #39ff88;padding:12px 18px;cursor:pointer}
#msg{margin-top:14px;white-space:pre-wrap}
.note{color:#8ba894;font-size:13px;line-height:1.5}
@media(max-width:650px){.account-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="account-wrap">
  <div class="account-box">
    <h1>👤 CRX // CRIAR CONTA DE PLAYER</h1>
    <p class="note">
      Área exclusiva do Mestre. Crie uma conta para um novo jogador e associe
      a ficha dele ao usuário. A senha será enviada pelo Supabase Auth.
    </p>

    <form id="accountForm">
      <div class="account-grid">
        <label>Nome do jogador
          <input id="displayName" required placeholder="Ex.: João">
        </label>
        <label>Login / e-mail
          <input id="email" type="email" required placeholder="Ex.: joao@crx.local">
        </label>
        <label>Senha inicial
          <input id="password" type="password" minlength="6" required>
        </label>
        <label>Ficha / personagem
          <input id="character" placeholder="Ex.: Erebus">
        </label>
      </div>
      <button type="submit">CRIAR CONTA</button>
      <div id="msg"></div>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script>
const msg = document.getElementById("msg");

async function createPlayerAccount(e){
  e.preventDefault();
  msg.textContent = "CRIANDO CONTA...";

  const session = JSON.parse(localStorage.getItem("crx_session") || "null");
  if(!session || session.role !== "master"){
    msg.textContent = "ACESSO NEGADO // somente o Mestre pode criar contas.";
    return;
  }

  if(!window.supabaseClient){
    msg.textContent = "ERRO // cliente Supabase não encontrado. Confira o config.js.";
    return;
  }

  const displayName = document.getElementById("displayName").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const character = document.getElementById("character").value.trim();

  const { data, error } = await window.supabaseClient.auth.signUp({
    email,
    password,
    options: { data: { role: "player", display_name: displayName, character } }
  });

  if(error){
    msg.textContent = "ERRO AO CRIAR CONTA:\n" + error.message;
    return;
  }

  msg.textContent =
    "CONTA CRIADA.\n\n" +
    "Jogador: " + displayName + "\n" +
    "Login: " + email + "\n" +
    "Ficha: " + (character || "não vinculada") + "\n\n" +
    "Se a confirmação de e-mail estiver ativa no Supabase, o jogador deverá confirmar o e-mail antes do primeiro acesso.";
  document.getElementById("accountForm").reset();
}

document.getElementById("accountForm").addEventListener("submit", createPlayerAccount);
</script>
</body>
</html>
