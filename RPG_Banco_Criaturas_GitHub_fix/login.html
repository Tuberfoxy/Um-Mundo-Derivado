<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRX // Acesso</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<div class="scanlines"></div>
<main class="login-shell">
  <div class="login-logo"><span>◈</span><div><strong>CRX</strong><small>CREATURE DATABASE</small></div></div>
  <form id="loginForm" class="login-card">
    <p class="eyebrow">SECURE ACCESS / 02</p>
    <h1>ACESSO RESTRITO</h1>
    <p class="muted">Selecione seu nível de acesso e identifique-se.</p>

    <label>TIPO DE ACESSO
      <select id="role">
        <option value="player">PLAYER</option>
        <option value="master">MESTRE</option>
      </select>
    </label>
    <label>USUÁRIO
      <input id="username" required autocomplete="username" placeholder="Digite seu usuário">
    </label>
    <label>SENHA
      <input id="password" required type="password" autocomplete="current-password" placeholder="Digite sua senha">
    </label>
    <button class="btn primary" type="submit">ENTRAR NO SISTEMA</button>
    <p id="loginMsg" class="login-msg"></p>

    <div class="demo">
      <b>ACESSOS LOCAIS DE CAMPANHA</b>
      <span>Use o usuário e a senha fornecidos individualmente pelo Mestre.</span>
      <small>As credenciais não são exibidas nesta tela.</small>
    </div>
  </form>
</main>
<script>
const accounts = {
  "mestre": {
    "passwordHash": "75ccb8f2a96f8136f4d7256349fdf3bf905137afbde7f385e93f0b2161007875",
    "role": "master",
    "name": "MESTRE"
  },
  "erebus": {
    "passwordHash": "f0b20bb6d6fad7901c81dcd90cd10fa59d889be1bfb7653efc36d0e9944e3311",
    "role": "player",
    "name": "EREBUS"
  },
  "rudy": {
    "passwordHash": "f558cad106bbf134807a9a335fc3db72c7783b7e47b77098b571c3b105dcbd93",
    "role": "player",
    "name": "RUDY"
  },
  "plataus": {
    "passwordHash": "e9affaad14afc7d8ac05a6240786a6960d4cbc8c55fc43a25057d83a3932556c",
    "role": "player",
    "name": "PLATAUS"
  }
};

async function sha256(text){
  const data = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2,"0")).join("");
}

document.getElementById("loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const role=document.getElementById("role").value;
  const user=document.getElementById("username").value.trim().toLowerCase();
  const pass=document.getElementById("password").value;
  const acc=accounts[user];
  const passHash=await sha256(pass);

  if(acc && acc.passwordHash===passHash && acc.role===role){
    localStorage.setItem("crx_session", JSON.stringify({user,role,name:acc.name}));
    location.href="index.html";
  }else{
    document.getElementById("loginMsg").textContent="ACESSO NEGADO // credenciais ou nível inválidos";
  }
});
</script>
</body>
</html>
